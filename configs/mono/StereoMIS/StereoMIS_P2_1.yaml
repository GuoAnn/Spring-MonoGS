inherit_from: "configs/mono/StereoMIS/base_config.yaml"

Dataset:
  dataset_path: "/root/GS_datasets/datasets/StereoMIS/"
  Calibration:
    fx: 516.9471435
    fy: 516.8573608
    cx: 302.289287
    cy: 257.488098
    k1: 0 #？
    k2: 0 #？
    p1: 0 #？
    p2: 0 #？
    k3: 0 #？
    width: 640
    height: 512
    #depth_scale: 5000.0 #100
    distorted: False

Training:
  spring_model:
    enabled: True
    n_anchors: 200  # 内窥镜场景需要更多的锚点
    k_neighbors: 10  # 增加近邻点数量以提高稳定性
    spring_k: 0.05   # 降低弹性系数以适应软组织变形
    damping: 0.02    # 增加阻尼以减小振荡
    dt: 0.01        # 减小时间步长以提高精度
    n_iterations: 10 # 增加迭代次数以提高优化效果
    visualize: True

