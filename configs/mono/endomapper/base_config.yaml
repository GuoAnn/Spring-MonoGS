Results:
  save_results: True
  save_dir: "results"
  save_trj: True
  save_trj_kf_intv: 10
  use_gui: True
  eval_rendering: False
  use_wandb: False

Dataset:
  type: 'tum'
  sensor_type: 'monocular'
  pcd_downsample: 64
  pcd_downsample_init: 32
  adaptive_pointsize: True
  point_size: 0.01

Training:
  init_itr_num: 1050
  init_gaussian_update: 100
  init_gaussian_reset: 500
  init_gaussian_th: 0.005
  init_gaussian_extent: 30
  tracking_itr_num: 100
  mapping_itr_num: 150
  gaussian_update_every: 150
  gaussian_update_offset: 50
  gaussian_th: 0.7
  gaussian_extent: 1.0
  gaussian_reset: 2001
  size_threshold: 20
  kf_interval: 5
  window_size: 8
  pose_window: 3
  edge_threshold: 1.1
  rgb_boundary_threshold: 0.01

  kf_translation: 0.08
  kf_min_translation: 0.05
  kf_overlap: 0.9 #0.8
  kf_cutoff: 0.3
  prune_mode: 'slam'
  single_thread: False
  spherical_harmonics: False

  lr:
    cam_rot_delta: 0.003
    cam_trans_delta: 0.001

  spring_model:
    enabled: True
    n_anchors: 1000
    k_neighbors: 8
    spring_k: 0.1
    damping: 0.01
    dt: 0.01
    n_iterations: 10
    visualize: True
    # 形变正则化（ARAP + 体积保持 + AMAP + 法向一致性）
    arap_weight: 0.1         # ARAP 边长应变损失权重
    vol_weight: 0.05         # 体积保持损失权重
    amap_weight: 0.05        # AMAP 防收缩约束损失权重（NRSfM AMAP 启发式）
    normal_weight: 0.02      # 法向一致性损失权重（NRSfM 度量张量不变性近似）
    # 自适应弹簧刚度（应变软化模型）
    adaptive_stiffness: True # 是否启用自适应刚度
    strain_threshold: 0.1    # 应变软化阈值（10% 应变时开始显著软化）

opt_params:
  iterations: 30000
  position_lr_init: 0.0016
  position_lr_final: 0.0000016
  position_lr_delay_mult: 0.01
  position_lr_max_steps: 30000
  feature_lr: 0.0025
  opacity_lr: 0.05
  scaling_lr: 0.001
  rotation_lr: 0.001
  percent_dense: 0.01
  lambda_dssim: 0.2
  densification_interval: 100
  opacity_reset_interval: 3000
  densify_from_iter: 500
  densify_until_iter: 15000
  densify_grad_threshold: 0.0002

model_params:
  sh_degree: 0
  source_path: ""
  model_path: ""
  resolution: -1
  white_background: False
  data_device: "cuda"

pipeline_params:
  convert_SHs_python: False
  compute_cov3D_python: False

Logging:
  level: "INFO"  # 可选: DEBUG, INFO, WARNING, ERROR
  show_anchor_updates: False  # 是否显示锚点更新信息